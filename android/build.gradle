group 'com.idlefish.flutterboost'
version '1.0-SNAPSHOT'

// 读取 Flutter SDK 路径 - lijizhi
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
// 如果当前目录没有 local.properties，尝试从父目录读取（example 目录）
if (!localPropertiesFile.exists()) {
    localPropertiesFile = rootProject.file('../example/android/local.properties')
}
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
// 如果 Flutter SDK 未配置，尝试从环境变量获取 - lijizhi
if (flutterRoot == null) {
    flutterRoot = System.getenv('FLUTTER_ROOT')
}
if (flutterRoot == null) {
    println("警告: Flutter SDK 未找到。如果这是 Flutter 插件项目，建议通过 'flutter build' 命令构建。")
    println("如果需要独立编译，请在 local.properties 文件中设置 flutter.sdk 路径，或设置 FLUTTER_ROOT 环境变量。")
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        // 添加本地 Flutter SDK 仓库 - lijizhi
        if (flutterRoot != null) {
            flatDir {
                dirs "$flutterRoot/bin/cache/artifacts/engine/android-arm"
            }
        }
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.idlefish.flutterboost'
    compileSdkVersion 31
    defaultConfig {
        minSdkVersion 16
        targetSdkVersion 31
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    lintOptions {
        disable 'InvalidPackage'
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Flutter 嵌入库依赖 - 使用 compileOnly，实际使用时由 Flutter 应用提供 - lijizhi
    // 注意：Flutter 插件通常应该通过 Flutter 工具链构建，而不是独立编译
    // 如果需要独立编译，请确保 Flutter SDK 已正确配置
    if (flutterRoot != null) {
        def flutterJar = file("$flutterRoot/bin/cache/artifacts/engine/android-arm/flutter.jar")
        if (flutterJar.exists()) {
            compileOnly files(flutterJar)
        }
    }
    
    // AndroidX 核心库依赖 - lijizhi
    compileOnly 'androidx.core:core:1.6.0'
    compileOnly 'com.google.android.material:material:1.0.0'
    compileOnly 'com.alibaba:fastjson:1.2.41'

}

ext {
    groupId = 'com.taobao.fleamarket'
    artifactId = "FlutterBoost"
}

